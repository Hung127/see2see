[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolve"
version = "0.1.0"
description = "EVOLVE — an artificial-life ecosystem with evolving neural controllers"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viz = ["pygame-ce>=2.5"]
report = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
evolve = "evolve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: slower end-to-end simulation tests",
    "slow: long-running tests excluded by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"

# Experiment F -- no predators (DESIGN §13).
# All attack loci are clipped to 0 at founding (setup hook `no_predators`) and
# the predation stage is switched off for the whole run. Readouts: defence,
# speed, size and energy-allocation drift.
seed: 6
ticks: 30000

world: {width: 1000.0, height: 1000.0, n_field_cells: 40, cell_size: 25.0}
plants: {initial: 6000, max: 20000}
organisms: {initial: 300, max: 2000}
energy: {bite: 0.5, eta_p: 0.75}
genetics: {mode: asexual}
environment: {}
stats: {interval: 50, interactions: sampled}

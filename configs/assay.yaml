# Assay G -- pre-registered evolved-vs-random comparison (DESIGN §13).
# Evolution phase configuration: the A baseline, asexual, no predators, clumped
# plants for 20,000 ticks, 6 replicate seeds. The runner samples genomes from
# the survivors *before* the paired arenas are run and writes
# pre_registration.md before any engine is constructed.
seed: 100
ticks: 20000

world: {width: 1000.0, height: 1000.0, n_field_cells: 40, cell_size: 25.0}
plants: {initial: 6000, max: 20000}
organisms: {initial: 300, max: 2000}
energy: {bite: 0.5, eta_p: 0.75}
genetics: {mode: asexual}
environment: {}
stats: {interval: 50, interactions: sampled}

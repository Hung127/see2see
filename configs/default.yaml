# EVOLVE default configuration -- the calibrated baseline (docs/CALIBRATION.md).
# Runs at design scale (30,000 ticks); the experiment runner scales this down
# for the test machine unless --full is given.
seed: 42
ticks: 30000

world:
  width: 1000.0
  height: 1000.0
  boundaries: wrap
  n_field_cells: 40
  cell_size: 25.0

plants:
  initial: 6000
  max: 20000
  k0: 5.0
  r: 0.06
  seed_cost: 0.2
  germination_per_tick: 20
  senescence: 0.002

organisms:
  initial: 300
  max: 2000
  maturity_age: 50
  health_max: 100.0
  health_regen: 0.05

energy:
  bite: 0.5
  eta_p: 0.75
  water_stress_cost: 2.0

genetics:
  mode: asexual

environment:
  t_mean: 20.0
  t_amp: 6.0
  m_mean: 0.55
  m_amp: 0.15
  season_period: 2000
  rain_rate: 0.002
  soil_diffusion: 0.1
  flood_damage: 10.0

stats:
  interval: 50
  snapshot_interval: 5000
  interactions: sampled
